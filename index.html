<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | Kultura_Treyding </title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body, html {
            width: 100%;
            min-height: 100vh;
            background-color: #070707;
            color: #ffffff;
            overflow-x: hidden;
        }

        .po-pages {
            position: relative;
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            background: radial-gradient(58rem 34rem at 50% -9rem, rgba(128, 178, 255, 0.18), rgba(0, 0, 0, 0.62)), linear-gradient(0deg, rgb(9, 16, 29) 0%, rgb(7, 9, 15) 24%, rgb(7, 7, 7) 60%, rgb(7, 7, 7) 100%);
            overflow: hidden;
        }

        /* Шапка */
        header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24rem 32rem;
            max-width: 1200rem;
            width: 100%;
            margin: 0 auto;
        }

        .logo {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        .lang-switcher {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        /* Основной контент */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
        }

        .register-container {
            width: 100%;
            max-width: 440px;
            background: rgba(15, 18, 25, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 32px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .title-block {
            text-align: center;
            margin-bottom: 24px;
        }

        .title-block h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .title-block p {
            font-size: 13px;
            color: #94a3b8;
        }

        /* Кнопка Google */
        .google-btn {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.2s;
        }

        .google-btn:hover {
            background: #f1f5f9;
        }

        /* Форма */
        .form-group {
            margin-bottom: 16px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 16px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #3b82f6;
        }

        .submit-btn {
            width: 100%;
            background: #60a5fa;
            color: #0f172a;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #93c5fd;
        }

        .footer-link {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #94a3b8;
        }

        .footer-link a {
            color: #60a5fa;
            text-decoration: none;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="po-pages">
        <header>
            <div class="logo">Kultura_Treyding</div>
            <div class="lang-switcher">
                🇷🇺 RU ▾
            </div>
        </header>

        <main>
            <div class="register-container">
                <div class="title-block">
                    <h1>РЕГИСТРАЦИЯ</h1>
                    <p>Для полного доступа создадим аккаунт у брокера PocketOption</p>
                </div>

                <button class="google-btn">
                    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.19-1.84H9v3.48h4.84c-.21 1.12-.84 2.07-1.79 2.71v2.25h2.9c1.7-1.57 2.69-3.88 2.69-6.6z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.25c-.81.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.73H.95v2.33C2.42 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.95 10.7c-.18-.54-.28-1.12-.28-1.7s.1-1.16.28-1.7V4.97H.95C.35 6.17 0 7.54 0 9s.35 2.83.95 4.03l3-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.47.89 11.43 0 9 0 5.48 0 2.42 2.02.95 4.97l3 2.33c.71-2.14 2.7-3.72 5.05-3.72z"/></svg>
                    Регистрация через Google
                </button>

                <form>
                    <div class="form-group">
                        <label>Электронная почта *</label>
                        <input type="email" class="form-control" placeholder="Электронная почта">
                    </div>

                    <div class="form-group">
                        <label>Пароль *</label>
                        <input type="password" class="form-control" placeholder="Пароль">
                    </div>

                    <div class="form-group">
                        <label>Повтор пароля *</label>
                        <input type="password" class="form-control" placeholder="Повтор пароля">
                    </div>

                    <button type="submit" class="submit-btn">Регистрация</button>
                </form>

                <div class="footer-link">
                    Уже есть аккаунт? <a href="#">Войти</a>
                </div>
            </div>
        </main>
    </div>

</body>
</html>

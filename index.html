<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Mini App</title>
    <!-- Подключаем официальный скрипт Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #1e1e1e);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 { margin-top: 0; font-size: 1.2rem; }
        button {
            background-color: var(--tg-theme-button-color, #2ecc71);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🚀 Terminal Web App</h2>
        <p>Добро пожаловать в торговый терминал! Здесь можно управлять рисками и следить за аналитикой.</p>
        <button id="mainBtn">Нажми меня</button>
    </div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        document.getElementById('mainBtn').addEventListener('click', function() {
            tg.showAlert("Привет! Mini App успешно подключено к Telegram.");
        });
    </script>
</body>
</html>

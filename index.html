    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0a0a12;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(123, 47, 252, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(0, 210, 255, 0.05) 0%, transparent 60%),
                linear-gradient(180deg, #0a0a12 0%, #14142a 50%, #0a0a12 100%);
        }

        .background::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.03), transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.03), transparent),
                radial-gradient(2px 2px at 50px 160px, rgba(255,255,255,0.03), transparent),
                radial-gradient(2px 2px at 90px 40px, rgba(255,255,255,0.03), transparent),
                radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.03), transparent),
                radial-gradient(2px 2px at 160px 30px, rgba(255,255,255,0.03), transparent);
            background-size: 200px 200px;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 420px;
            margin: 0 auto;
            padding: 12px 16px 100px 16px;
        }

        /* ===== ПРИВЕТСТВИЕ ===== */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a12;
            animation: fadeOut 0.5s ease-out 2.5s forwards;
        }

        #splashScreen .logo { font-size: 3rem; margin-bottom: 12px; }
        #splashScreen .title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #7b2ffc, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #splashScreen .sub {
            color: rgba(255,255,255,0.3);
            font-size: 0.9rem;
            margin-top: 8px;
            letter-spacing: 2px;
        }
        #splashScreen .loader {
            margin-top: 24px;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.05);
            border-top: 3px solid #7b2ffc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeOut { 0% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }

        /* ===== ХЕДЕР ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(20, 20, 42, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid rgba(123, 47, 252, 0.15);
            margin-bottom: 16px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-logo {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #7b2ffc, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-logo span {
            font-size: 0.6rem;
            -webkit-text-fill-color: rgba(255,255,255,0.3);
            background: none;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
        }
        .header-right .id { color: rgba(255,255,255,0.6); }

        /* ===== СТАТИСТИКА ===== */
        .daily-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: rgba(20, 20, 42, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-card .value { font-size: 1.2rem; font-weight: 700; line-height: 1.4; }
        .stat-card .label { font-size: 0.55rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value.green { color: #00c853; }
        .stat-card .value.red { color: #ff1744; }
        .stat-card .value.yellow { color: #ffab00; }
        .stat-card .value.blue { color: #448aff; }

        /* ===== ВАЛЮТНЫЕ ПАРЫ ===== */
        .pair-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .pair-item {
            background: rgba(20, 20, 42, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.04);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pair-item:hover { border-color: rgba(123, 47, 252, 0.2); transform: translateX(3px); }
        .pair-item:active { transform: scale(0.98); }

        .pair-info { display: flex; flex-direction: column; gap: 1px; }
        .pair-name { font-weight: 600; font-size: 0.9rem; color: #fff; }
        .pair-price { font-size: 0.75rem; color: rgba(255,255,255,0.4); font-weight: 500; }
        .pair-price .change.up { color: #00c853; }
        .pair-price .change.down { color: #ff1744; }

        .pair-signal { display: flex; align-items: center; gap: 8px; }

        .signal-badge {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .signal-badge.up { background: rgba(0, 200, 83, 0.15); color: #00c853; border: 1px solid rgba(0, 200, 83, 0.2); }
        .signal-badge.down { background: rgba(255, 23, 68, 0.15); color: #ff1744; border: 1px solid rgba(255, 23, 68, 0.2); }
        .signal-badge.neutral { background: rgba(255, 171, 0, 0.15); color: #ffab00; border: 1px solid rgba(255, 171, 0, 0.2); }

        .signal-arrow { font-size: 1rem; }
        .signal-arrow.up { color: #00c853; }
        .signal-arrow.down { color: #ff1744; }
        .signal-arrow.neutral { color: #ffab00; }

        .pair-category {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 4px 4px 4px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            margin-top: 4px;
        }

        /* ===== МОДАЛКА ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.3s ease-out;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: linear-gradient(180deg, #1a1a32, #0f0f1f);
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            border: 1px solid rgba(123, 47, 252, 0.2);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .modal-title { font-size: 1.2rem; font-weight: 700; color: #fff; }
        .modal-close {
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .modal-close:hover { background: rgba(255,255,255,0.05); color: #fff; }

        .modal-price {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            color: #fff;
            padding: 14px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 14px;
        }
        .modal-price .change { font-size: 0.9rem; font-weight: 500; margin-left: 8px; }
        .modal-price .change.up { color: #00c853; }
        .modal-price .change.down { color: #ff1744; }

        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }

        .modal-item {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .modal-item .label { font-size: 0.55rem; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.5px; }
        .modal-item .value { font-size: 0.95rem; font-weight: 600; margin-top: 2px; color: #fff; }
        .modal-item .value.green { color: #00c853; }
        .modal-item .value.red { color: #ff1744; }
        .modal-item .value.yellow { color: #ffab00; }
        .modal-item .value.blue { color: #448aff; }

        .modal-indicators {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.05);
            margin: 12px 0;
        }
        .modal-indicators .title { font-size: 0.6rem; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .indicator-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 0.85rem; }
        .indicator-row .name { color: rgba(255,255,255,0.5); }
        .indicator-row .value.buy { color: #00c853; }
        .indicator-row .value.sell { color: #ff1744; }
        .indicator-row .value.neutral { color: #ffab00; }

        .strength-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-top: 8px;
        }
        .strength-section .label { font-size: 0.6rem; color: rgba(255,255,255,0.35); text-transform: uppercase; }
        .strength-section .value { font-size: 1rem; font-weight: 700; }

        .strength-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }
        .strength-bar .fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #ff1744, #ffab00, #00c853); transition: width 0.6s; }

        /* ===== ФУТЕР ===== */
        .footer {
            text-align: center;
            padding: 20px 0 10px 0;
            color: rgba(255,255,255,0.12);
            font-size: 0.7rem;
            letter-spacing: 1px;
        }
        .footer span {
            background: linear-gradient(135deg, #7b2ffc, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

        }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(123, 47, 252, 0.3); border-radius: 10px; }

        @media (max-width: 380px) {
            .daily-stats { grid-template-columns: repeat(2, 1fr); }
            .pair-name { font-size: 0.8rem; }
        }
    </style>
</head>

        // ==========================================
        // 3. ГЕНЕРАЦИЯ ДАННЫХ ДЛЯ ПАР
        // ==========================================
        // Пары с реальными данными (активные)
        const ACTIVE_PAIRS = {
            'AUD/CAD': { price: 0.97460, signal: 'up', strength: 61, change: '+0.32%', entry: 0.97460, current: 0.97550, plus: 3, minus: 0, ret: 1 },

            'Bitcoin': { price: 67250.00, signal: 'up', strength: 89, change: '+2.15%', entry: 67250.00, current: 68200.00, plus: 8, minus: 1, ret: 0 },
            'Ethereum': { price: 3450.00, signal: 'down', strength: 55, change: '-0.75%', entry: 3450.00, current: 3425.00, plus: 3, minus: 2, ret: 1 },
            'SP500': { price: 5120.50, signal: 'up', strength: 67, change: '+0.45%', entry: 5120.50, current: 5145.00, plus: 3, minus: 0, ret: 1 },
            'US100': { price: 17850.00, signal: 'down', strength: 42, change: '-0.28%', entry: 17850.00, current: 17800.00, plus: 1, minus: 2, ret: 0 },
            'Apple': { price: 175.30, signal: 'up', strength: 58, change: '+0.52%', entry: 175.30, current: 176.20, plus: 2, minus: 1, ret: 0 },

        };

        // Индикаторы
        function getIndicators(pairName) {
            const base = [
                { name: 'RSI (14)', value: '68.5', status: 'buy', label: 'Покупка' },
                { name: 'MACD', value: '↑ Бычий', status: 'buy', label: '' },
                { name: 'MA (50)', value: 'Цена выше', status: 'buy', label: '' },
                { name: 'Объем', value: 'Средний', status: 'neutral', label: '' },
            ];
            const custom = {
                'EUR/USD': [
                    { name: 'RSI (14)', value: '42.3', status: 'sell', label: 'Продажа' },
                    { name: 'MACD', value: '↓ Медвежий', status: 'sell', label: '' },
                    { name: 'MA (50)', value: 'Цена ниже', status: 'sell', label: '' },
                    { name: 'Объем', value: 'Низкий', status: 'neutral', label: '' },
                ],
                'GBP/JPY': [
                    { name: 'RSI (14)', value: '72.1', status: 'buy', label: 'Покупка' },
                    { name: 'MACD', value: '↑ Бычий', status: 'buy', label: '' },
                    { name: 'MA (50)', value: 'Цена выше', status: 'buy', label: '' },
                    { name: 'Объем', value: 'Высокий', status: 'buy', label: '' },
                ],
                'BTC/USD': [
                    { name: 'RSI (14)', value: '65.8', status: 'buy', label: 'Покупка' },
                    { name: 'MACD', value: '↑ Бычий', status: 'buy', label: '' },
                    { name: 'MA (50)', value: 'Цена выше', status: 'buy', label: '' },
                    { name: 'Объем', value: 'Очень высокий', status: 'buy', label: '' },
                ],
                'ETH/USD': [
                    { name: 'RSI (14)', value: '38.2', status: 'sell', label: 'Продажа' },
                    { name: 'MACD', value: '↓ Медвежий', status: 'sell', label: '' },
                    { name: 'MA (50)', value: 'Цена ниже', status: 'sell', label: '' },
                    { name: 'Объем', value: 'Средний', status: 'neutral', label: '' },
                ],
                'USD/CHF': [
                    { name: 'RSI (14)', value: '50.0', status: 'neutral', label: 'Нейтрально' },
                    { name: 'MACD', value: '↔ Плоский', status: 'neutral', label: '' },
                    { name: 'MA (50)', value: 'Цена около', status: 'neutral', label: '' },
                    { name: 'Объем', value: 'Средний', status: 'neutral', label: '' },
                ],
            };
            return custom[pairName] || base;
        }

        // ==========================================
        // 4. ПОСТРОЕНИЕ СПИСКА
        // ==========================================
        const signalMap = { up: 'ВВЕРХ', down: 'ВНИЗ', neutral: 'НЕЙТРАЛЬНО' };
        const catNames = {
            forex: '💱 ВАЛЮТНЫЕ ПАРЫ',
            crypto: '🪙 КРИПТОВАЛЮТЫ',
            commodities: '🛢️ СЫРЬЕВЫЕ ТОВАРЫ',
            stocks: '📈 АКЦИИ',
            indices: '📊 ИНДЕКСЫ'
        };

        function buildPairData() {
            return ALL_PAIRS.map(p => {
                const active = ACTIVE_PAIRS[p.name];
                if (active) {
                    return { ...p, ...active, hasData: true };
                }
                return { ...p, hasData: false, price: 0, signal: 'neutral', strength: 0, change: '+0.00%', entry: 0, current: 0, plus: 0, minus: 0, ret: 0 };
            });
        }

        const PAIRS = buildPairData();

        // ==========================================
        // 5. РЕНДЕРИНГ
        // ==========================================
        function renderPairs() {
            const container = document.getElementById('pairList');
            container.innerHTML = '';

            let currentCat = '';
            let activeCount = 0;
            let winCount = 0;

            PAIRS.forEach((pair, index) => {
                // Категория
                if (pair.cat !== currentCat) {
                    currentCat = pair.cat;
                    const catDiv = document.createElement('div');
                    catDiv.className = 'pair-category';
                    catDiv.textContent = catNames[pair.cat] || pair.cat;
                    container.appendChild(catDiv);
                }

                const div = document.createElement('div');
                div.className = 'pair-item';
                div.setAttribute('data-index', index);

                const priceDisplay = pair.hasData ? 
                    pair.price.toFixed(pair.price < 1 ? 5 : 2) : 
                    '—';
                const changeHtml = pair.hasData ?
                    `<span class="change ${pair.change.includes('+') ? 'up' : 'down'}">${pair.change}</span>` :
                    '<span style="color:rgba(255,255,255,0.15);font-size:0.6rem;">ожидание</span>';

                const signalText = pair.hasData ? signalMap[pair.signal] : '—';
                const signalClass = pair.hasData ? pair.signal : 'neutral';
                const arrow = pair.hasData ?
                    (pair.signal === 'up' ? '↑' : pair.signal === 'down' ? '↓' : '↔') :
                    '•';

                div.innerHTML = `
                    <div class="pair-info">
                        <div class="pair-name">${pair.name}</div>
                        <div class="pair-price">$${priceDisplay} ${changeHtml}</div>
                    </div>
                    <div class="pair-signal">
                        <span class="signal-arrow ${signalClass}">${arrow}</span>
                        <span class="signal-badge ${signalClass}">${signalText}</span>
                    </div>
                `;

                if (pair.hasData) {
                    activeCount++;
                    if (pair.signal === 'up' && pair.plus > pair.minus) winCount++;
                    div.addEventListener('click', () => openModal(index));
                } else {
                    div.style.opacity = '0.5';
                    div.addEventListener('click', () => {
                        if (tg) tg.showAlert('⏳ Сигнал в разработке');
                    });
                }

                container.appendChild(div);
            });

            // Статистика
            document.getElementById('totalSignals').textContent = activeCount;
            document.getElementById('winSignals').textContent = winCount;
            const loseCount = activeCount - winCount;
            document.getElementById('loseSignals').textContent = loseCount;
            const winRate = activeCount > 0 ? Math.round((winCount / activeCount) * 100) : 0;
            document.getElementById('winRate').textContent = winRate + '%';
        }

        // ==========================================
        // 6. МОДАЛКА
        // ==========================================
        function openModal(index) {
            const pair = PAIRS[index];
            if (!pair.hasData) {
                if (tg) tg.showAlert('⏳ Сигнал в разработке');
                return;
            }

            const indicators = getIndicators(pair.name);

            document.getElementById('modalPairName').textContent = pair.name;
            document.getElementById('modalPrice').innerHTML = `
                $${pair.price.toFixed(pair.price < 1 ? 5 : 2)}
                <span class="change ${pair.change.includes('+') ? 'up' : 'down'}">${pair.change}</span>
            `;
            document.getElementById('modalSignal').textContent = `${pair.signal === 'up' ? '↑' : pair.signal === 'down' ? '↓' : '↔'} ${signalMap[pair.signal]}`;
            document.getElementById('modalSignal').className = `value ${pair.signal === 'up' ? 'green' : pair.signal === 'down' ? 'red' : 'yellow'}`;
            document.getElementById('modalStrength').textContent = pair.strength;
            document.getElementById('modalEntry').textContent = pair.entry.toFixed(pair.entry < 1 ? 5 : 2);
            document.getElementById('modalCurrent').textContent = pair.current.toFixed(pair.current < 1 ? 5 : 2);
            document.getElementById('modalPlus').textContent = `+${pair.plus}`;
            document.getElementById('modalMinus').textContent = `-${pair.minus}`;
            document.getElementById('modalReturn').textContent = `↔${pair.ret}`;
            document.getElementById('modalStrengthValue').textContent = `${pair.strength}/100`;
            document.getElementById('modalStrengthBar').style.width = `${pair.strength}%`;

            const container = document.getElementById('modalIndicators');
            let html = '<div class="title">ИНДИКАТОРЫ</div>';
            indicators.forEach(ind => {
                const statusClass = ind.status === 'buy' ? 'buy' : ind.status === 'sell' ? 'sell' : 'neutral';
                const label = ind.label ? ` (${ind.label})` : '';
                html += `
                    <div class="indicator-row">
                        <span class="name">${ind.name}</span>
                        <span class="value ${statusClass}">${ind.value}${label}</span>
                    </div>
                `;
            });
            container.innerHTML = html;

            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ==========================================
        // 7. СТАРТ
        // ==========================================
        renderPairs();

        setTimeout(() => {
            const splash = document.getElementById('splashScreen');
            if (splash) splash.style.display = 'none';
        }, 2800);

        console.log('📡 Kultura_Treyding запущен');
        console.log(`📊 Загружено ${PAIRS.length} активов`);
        console.log(`✅ Активных сигналов: ${PAIRS.filter(p => p.hasData).length}`);
    </script>
